# =============================================================================
# ENPM818T -- GP3 Scenario 2 (Healthcare)
# Docker Compose starter: PostgreSQL + MongoDB + Neo4j + app
# -----------------------------------------------------------------------------
# What this file provides:
#   - postgres   : persistent SQL DB, seeded from ./postgresql/*.sql
#   - mongodb    : persistent document store
#   - mongo-seed : one-shot sidecar that runs your mongodb/mongo_*.js files
#   - neo4j      : medical-knowledge graph database
#   - neo4j-seed : one-shot sidecar that runs your neo4j/*.cypher files
#   - app        : your Python application (requires Dockerfile)
#
# Every DB has a healthcheck. The app waits for each DB to be
# healthy (not just started) before it launches, so you don't need
# to add retry logic just to survive startup.
#
# Neo4j takes 30-60 seconds to start on first boot. The healthcheck's
# start_period accounts for this; be patient on the first run.
#
# Usage:
#   docker-compose up --build           # start everything, foreground
#   docker-compose up -d                # start detached
#   docker-compose logs -f app          # tail app logs
#   docker-compose down                 # stop (keeps data volumes)
#   docker-compose down -v              # also wipe DB data
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-enpm818t}
      POSTGRES_DB: ${PG_DB:-healthcare_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Any .sql file here runs on FIRST boot against an EMPTY volume.
      # To re-seed after schema changes: docker-compose down -v
      - ./postgresql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # mongo-seed -- one-shot sidecar that seeds MongoDB
  #
  # Unlike Postgres, Mongo has no /docker-entrypoint-initdb.d pattern,
  # so we run your setup scripts with a throwaway container.
  # ---------------------------------------------------------------------------
  mongo-seed:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./mongodb:/workdir:ro
    working_dir: /workdir
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        echo "mongo-seed: loading mongo_setup.js"
        mongosh --host mongodb --quiet --file mongo_setup.js
        echo "mongo-seed: loading mongo_data.js"
        mongosh --host mongodb --quiet --file mongo_data.js
        echo "mongo-seed: done."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Neo4j
  #
  # NEO4J_AUTH=neo4j/<password> sets the initial credentials.
  # Password must be AT LEAST 8 CHARACTERS or Neo4j refuses to start.
  #
  # Ports:
  #   7474 -- HTTP (Neo4j Browser at http://localhost:7474)
  #   7687 -- Bolt protocol (drivers + cypher-shell)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-enpm818t-neo4j}
      # Exposed so the healthcheck below can read it
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-enpm818t-neo4j}
      # Reasonable heap defaults for a small dev dataset
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s     # give Neo4j time to boot before first check

  # ---------------------------------------------------------------------------
  # neo4j-seed -- one-shot sidecar that loads the knowledge graph
  # ---------------------------------------------------------------------------
  neo4j-seed:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j:/workdir:ro
    working_dir: /workdir
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        echo "neo4j-seed: loading graph_setup.cypher"
        cypher-shell -a bolt://neo4j:7687 \
          -u neo4j -p "${NEO4J_PASSWORD:-enpm818t-neo4j}" \
          -f graph_setup.cypher
        echo "neo4j-seed: loading graph_data.cypher"
        cypher-shell -a bolt://neo4j:7687 \
          -u neo4j -p "${NEO4J_PASSWORD:-enpm818t-neo4j}" \
          -f graph_data.cypher
        echo "neo4j-seed: done."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Your Python application
  #
  # NOTE: Inside the Compose network, services reach each other by
  # SERVICE NAME, not localhost. Your app sees:
  #   DB_HOST=postgres   MONGO_HOST=mongodb   NEO4J_URI=bolt://neo4j:7687
  # (Your local dev shell, running outside Compose, still uses
  #  localhost -- that's what the published port mappings are for.)
  # ---------------------------------------------------------------------------
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # Seeds run once and exit. The app does NOT need to wait for
      # them. If you want to guarantee seeded data, add e.g.:
      #   neo4j-seed: { condition: service_completed_successfully }
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${PG_DB:-healthcare_management}
      DB_USER: ${PG_USER:-healthcare_admin}
      DB_PASSWORD: ${PG_PASSWORD:-enpm818t}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-healthcare_management}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-enpm818t-neo4j}
    stdin_open: true       # keep STDIN open for the menu-driven CLI
    tty: true              # allocate a pseudo-TTY

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  neo4j_logs:
